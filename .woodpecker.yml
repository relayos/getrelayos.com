when:
  - event: [push, pull_request]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  verify-docs-contract:
    image: node:20-alpine
    commands:
      - npm ci
      - apk add --no-cache python3
      - npm test

  build-site-image:
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: [pull_request]
    settings:
      registry: ghcr.io
      repo: ghcr.io/relayos/getrelayos.com
      dockerfile: Dockerfile.nextjs
      context: .
      dry_run: true
      tags:
        - pr-${CI_COMMIT_SHA:0:7}

  publish-site-image:
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: [push]
        branch: [main]
    settings:
      registry: ghcr.io
      repo: ghcr.io/relayos/getrelayos.com
      dockerfile: Dockerfile.nextjs
      context: .
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - latest
        - sha-${CI_COMMIT_SHA:0:7}
